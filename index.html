<style>
/* Layout: one-screen camera — header, viewfinder that fills the middle, looks strip, shutter row. Single dark look, like a real camera body. */
:root {
  color-scheme: dark;
  --bg: #17181b;
  --panel: #222429;
  --line: #34373e;
  --fg: #ede9e0;
  --muted: #9b978d;
  --accent: #f0b429;
  --accent-ink: #1d1604;
  --void: #0b0b0c;
  --stamp: #ff8a3d;
  --display: "Newsreader", Georgia, "Times New Roman", serif;
  --ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
* { box-sizing: border-box; }
html { height: 100%; box-sizing: border-box; }
body {
  height: 100%; margin: 0; overflow: hidden;
  background: var(--bg); color: var(--fg); font-family: var(--ui);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, label:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.app { height: 100%; max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; padding-block: 10px; }

header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand h1 { margin: 0; font-family: var(--display); font-style: italic; font-weight: 500; font-size: 28px; letter-spacing: -0.01em; }
.readout { font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; color: var(--muted); text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.toggles { display: flex; gap: 6px; flex: none; }
.tog {
  font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase;
  background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 6px 10px; color: var(--muted);
}
.tog[aria-pressed="true"] { color: var(--fg); border-color: var(--muted); }

.sources { display: flex; gap: 8px; }
.src {
  position: relative; flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font-size: 14px; font-weight: 500;
}
.src input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.src svg { width: 16px; height: 16px; flex: none; }

.stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
.vf { position: relative; background: var(--void); border-radius: 18px; overflow: hidden; }
.vf video, .vf canvas.still { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.vf video { transition: transform 0.6s cubic-bezier(.2, .7, .2, 1), filter 0.6s ease; }
.vf canvas.overlay { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.hint {
  position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); max-width: calc(100% - 24px);
  font-family: var(--mono); font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase;
  background: color-mix(in srgb, var(--void) 72%, transparent); color: var(--fg);
  padding: 7px 14px; border-radius: 999px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.hint b { color: var(--accent); font-weight: 500; }
.tag {
  position: absolute; left: 12px; top: 12px; font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--muted); background: color-mix(in srgb, var(--void) 70%, transparent); padding: 4px 8px; border-radius: 6px;
}
.target { position: absolute; right: 12px; top: 12px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.target canvas { width: 64px; border: 2px solid var(--accent); border-radius: 8px; display: block; background: var(--void); }
.target span { font-family: var(--mono); font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--fg);
  background: color-mix(in srgb, var(--void) 70%, transparent); padding: 2px 6px; border-radius: 4px; }

.status { min-height: 18px; margin: 0; font-size: 13px; color: var(--muted); text-align: center; line-height: 1.4; }
.status.warn { color: var(--stamp); }

.looks { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.looks::-webkit-scrollbar { display: none; }
.look {
  flex: none; font-size: 13px; padding: 7px 14px; border-radius: 999px; background: transparent; border: 1px solid var(--line); color: var(--muted);
}
.look[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }

.controls { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; padding-bottom: 4px; }
.thumb { justify-self: start; width: 52px; height: 52px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel) center/cover no-repeat; padding: 0; }
.thumb:disabled { opacity: 0.4; cursor: default; }
.shutter { position: relative; width: 76px; height: 76px; border-radius: 50%; border: 3px solid var(--fg); background: transparent; padding: 5px; }
.shutter span { display: grid; place-items: center; width: 100%; height: 100%; border-radius: 50%; background: var(--fg); transition: transform 0.12s, background 0.2s;
  font-size: 22px; color: var(--accent-ink); }
.shutter:active span { transform: scale(0.9); }
.shutter[data-phase="aiming"] span { background: var(--accent); }
.shutter[data-phase="scanning"] { opacity: 0.6; }
.side { justify-self: end; display: flex; gap: 8px; }
.round {
  display: flex; flex-direction: column; align-items: center; gap: 3px; background: transparent; border: none; padding: 0;
  font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted);
}
.round i { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); font-style: normal; font-size: 18px; color: var(--fg); }
.round:disabled { opacity: 0.4; cursor: default; }
.round.busy i { animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: 0.4; } }

.sheet { position: fixed; inset: 0; z-index: 20; background: color-mix(in srgb, var(--void) 75%, transparent); display: flex; align-items: flex-end; justify-content: center; }
.sheet-card {
  width: 100%; max-width: 560px; background: var(--panel); border-radius: 20px 20px 0 0; border-top: 1px solid var(--line);
  padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; gap: 14px; max-height: 92%; overflow-y: auto;
}
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.sheet-head h2 { margin: 0; font-family: var(--display); font-style: italic; font-weight: 500; font-size: 24px; }
.sheet-head small { display: block; font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-top: 2px; }
.done { background: var(--fg); color: var(--bg); border: none; border-radius: 999px; padding: 8px 16px; font-weight: 600; font-size: 14px; flex: none; }
.shots { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.shots figure { margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.shots img { width: 100%; max-height: 42vh; object-fit: contain; background: var(--void); border-radius: 10px; -webkit-user-select: auto; user-select: auto; -webkit-touch-callout: default; }
.shots figcaption { font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.save { background: transparent; border: 1px solid var(--line); border-radius: 10px; padding: 9px; font-weight: 500; font-size: 14px; }
.savehelp { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
.tip { margin: 0; font-size: 14px; line-height: 1.5; padding: 10px 12px; border-radius: 10px; background: color-mix(in srgb, var(--accent) 12%, transparent); }
.tip b { color: var(--accent); font-weight: 600; }

@media (prefers-reduced-motion: reduce) { .vf video { transition: none; } .round.busy i { animation: none; } .shutter span { transition: none; } }
</style>

<div class="app">

  <div class="sources">

<script>
/* ======================================================================
   Pure image maths (no page access) — easy to test on their own.
   ====================================================================== */

// Turn RGBA pixels into a grey brightness array.
function toGray(d, n) {
  const g = new Float32Array(n);
  for (let i = 0; i < n; i++) g[i] = 0.299 * d[i * 4] + 0.587 * d[i * 4 + 1] + 0.114 * d[i * 4 + 2];
  return g;
}

// Score every part of a small image for "interest" (edges + colour that stands out + saturation),
// then try hundreds of crops and return the best one, as fractions of the frame.
function findBestCrop(d, W, H) {
  const N = W * H, L = toGray(d, N), S = new Float32Array(N);
  let mr = 0, mg = 0, mb = 0;
  for (let i = 0; i < N; i++) {
    const r = d[i * 4], g = d[i * 4 + 1], b = d[i * 4 + 2];
    const mx = Math.max(r, g, b), mn = Math.min(r, g, b); S[i] = mx ? (mx - mn) / mx : 0;
    mr += r; mg += g; mb += b;
  }
  mr /= N; mg /= N; mb /= N;
  const grad = new Float32Array(N), cd = new Float32Array(N); let gmax = 1e-6, cmax = 1e-6;
  for (let y = 1; y < H - 1; y++) for (let x = 1; x < W - 1; x++) {
    const i = y * W + x;
    grad[i] = Math.abs(L[i + 1] - L[i - 1]) + Math.abs(L[i + W] - L[i - W]);
    const r = d[i * 4] - mr, g = d[i * 4 + 1] - mg, b = d[i * 4 + 2] - mb;
    cd[i] = Math.sqrt(r * r + g * g + b * b);
    if (grad[i] > gmax) gmax = grad[i]; if (cd[i] > cmax) cmax = cd[i];
  }
  const sal = new Float32Array(N);
  for (let i = 0; i < N; i++) sal[i] = 0.45 * grad[i] / gmax + 0.4 * cd[i] / cmax + 0.15 * S[i];
  for (let pass = 0; pass < 2; pass++) { // soften so we score regions, not single pixels
    const t = new Float32Array(N);
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      let s = 0, n = 0; for (let k = -2; k <= 2; k++) { const xx = x + k; if (xx >= 0 && xx < W) { s += sal[y * W + xx]; n++; } }
      t[y * W + x] = s / n;
    }
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      let s = 0, n = 0; for (let k = -2; k <= 2; k++) { const yy = y + k; if (yy >= 0 && yy < H) { s += t[yy * W + x]; n++; } }
      sal[y * W + x] = s / n;
    }
  }
  // summed-area tables make "total interest inside any rectangle" a 4-number lookup
  const W1 = W + 1, I = new Float64Array(W1 * (H + 1)), IX = new Float64Array(I.length), IY = new Float64Array(I.length);
  for (let y = 0; y < H; y++) { let r = 0, rx = 0, ry = 0;
    for (let x = 0; x < W; x++) { const v = sal[y * W + x]; r += v; rx += v * x; ry += v * y;
      const o = (y + 1) * W1 + x + 1; I[o] = I[o - W1] + r; IX[o] = IX[o - W1] + rx; IY[o] = IY[o - W1] + ry; } }
  const sum = (T, x, y, w, h) => T[(y + h) * W1 + x + w] - T[y * W1 + x + w] - T[(y + h) * W1 + x] + T[y * W1 + x];
  const total = sum(I, 0, 0, W, H) || 1e-6, mean = total / N;
  const thirds = [[1 / 3, 1 / 3], [2 / 3, 1 / 3], [1 / 3, 2 / 3], [2 / 3, 2 / 3]];
  let best = null;
  for (let sc = 0.5; sc <= 0.781; sc += 0.04) {
    const bw = Math.round(W * sc), bh = Math.round(H * sc);
    for (let y = 0; y <= H - bh; y += 2) for (let x = 0; x <= W - bw; x += 2) {
      const s = sum(I, x, y, bw, bh); if (s <= 0) continue;
      const cx = (sum(IX, x, y, bw, bh) / s - x) / bw, cy = (sum(IY, x, y, bw, bh) / s - y) / bh;
      let dmin = 9; for (const [tx, ty] of thirds) dmin = Math.min(dmin, Math.hypot(cx - tx, cy - ty));
      const score = (s / total) * 0.6 + ((s / (bw * bh)) / mean - 1) * 0.5 + Math.max(0, 1 - dmin / 0.3) * 0.15;
      if (!best || score > best.score) best = { x: x / W, y: y / H, w: bw / W, h: bh / H, score };
    }
  }
  return best;
}

// Pick a film look from the scene's light and colour.
function chooseLook(d, n) {
  let sl = 0, sl2 = 0, ss = 0, warm = 0;
  for (let i = 0; i < n; i++) {
    const r = d[i * 4], g = d[i * 4 + 1], b = d[i * 4 + 2], l = 0.299 * r + 0.587 * g + 0.114 * b;
    const mx = Math.max(r, g, b), mn = Math.min(r, g, b);
    sl += l; sl2 += l * l; ss += mx ? (mx - mn) / mx : 0; warm += r - b;
  }
  const L = sl / n, sd = Math.sqrt(Math.max(0, sl2 / n - L * L)), sat = ss / n, w = warm / n;
  let look, why;
  if (L < 70) { look = "mono"; why = "low light"; }
  else if (sat < 0.14) { look = "mono"; why = "muted colours"; }
  else if (sd > 68) { look = "faded"; why = "harsh contrast"; }
  else if (w > 14) { look = "golden"; why = "warm light"; }
  else if (w < -14) { look = "slate"; why = "cool tones"; }
  else { look = "golden"; why = "even light"; }
  return { look, why };
}

// Build a grey, zero-mean version of the target so it can be matched in any lighting.
function makeTemplate(gray, tw, th) {
  let m = 0; for (let i = 0; i < gray.length; i++) m += gray[i]; m /= gray.length;
  const t = new Float32Array(gray.length); let nn = 0;
  for (let i = 0; i < gray.length; i++) { t[i] = gray[i] - m; nn += t[i] * t[i]; }
  return { tw, th, t, norm: Math.sqrt(nn) || 1e-6 };
}

// Find where a template sits in a live frame (normalised cross-correlation),
// trying several sizes because the person may step closer or further away.
// Returns {x, y, w, h (fractions), score 0..1, idx (which size matched)}.
function matchTemplates(G, W, H, tpls, hintIdx) {
  const W1 = W + 1, S = new Float64Array(W1 * (H + 1)), S2 = new Float64Array(S.length);
  for (let y = 0; y < H; y++) { let r = 0, r2 = 0;
    for (let x = 0; x < W; x++) { const v = G[y * W + x]; r += v; r2 += v * v;
      const o = (y + 1) * W1 + x + 1; S[o] = S[o - W1] + r; S2[o] = S2[o - W1] + r2; } }
  const box = (T, x, y, w, h) => T[(y + h) * W1 + x + w] - T[y * W1 + x + w] - T[(y + h) * W1 + x] + T[y * W1 + x];
  const ncc = (tp, x, y) => {
    const { tw, th, t } = tp, n = tw * th;
    const s = box(S, x, y, tw, th), v = box(S2, x, y, tw, th) - (s * s) / n;
    if (v < 1e-3) return -1;
    let num = 0;
    for (let j = 0; j < th; j++) { const row = (y + j) * W + x, tr = j * tw; for (let i = 0; i < tw; i++) num += t[tr + i] * G[row + i]; }
    return num / (tp.norm * Math.sqrt(v));
  };
  let lo = 0, hi = tpls.length - 1;
  if (hintIdx != null) { lo = Math.max(0, hintIdx - 2); hi = Math.min(tpls.length - 1, hintIdx + 2); }
  let best = { score: -2 };
  for (let k = lo; k <= hi; k++) {
    const tp = tpls[k]; if (tp.tw > W || tp.th > H) continue;
    for (let y = 0; y <= H - tp.th; y += 2) for (let x = 0; x <= W - tp.tw; x += 2) {
      const s = ncc(tp, x, y); if (s > best.score) best = { score: s, x, y, idx: k };
    }
  }
  if (best.score < -1) return null;
  const tp = tpls[best.idx]; // refine to the exact pixel
  for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {

      if (state.stamp) {
        const d = new Date(), pad = (k) => String(k).padStart(2, "0");
        const txt = `'${pad(d.getFullYear() % 100)} ${pad(d.getMonth() + 1)} ${pad(d.getDate())}`, fs = Math.round(c.width * 0.042);
        x.font = `500 ${fs}px "IBM Plex Mono", ui-monospace, Menlo, monospace`; x.textAlign = "right";
        x.shadowColor = "rgba(255,110,40,.7)"; x.shadowBlur = fs * 0.35; x.fillStyle = "#ff8a3d";
        x.fillText(txt, c.width * 0.95, c.height * 0.95);
      }
      return c;
    };
    const full = out(0, 0, w, h);
    let framed = full;
    if (crop) {
      const cx = Math.max(0, crop.x), cy = Math.max(0, crop.y);
      const cw = Math.min(1, crop.x + crop.w) - cx, ch = Math.min(1, crop.y + crop.h) - cy;
      if (cw < 0.97 || ch < 0.97) framed = out(cx * w, cy * h, cw * w, ch * h);
    }
    return { full, framed };
  }
  const toBlob = (c) => new Promise((res) => c.toBlob(res, "image/jpeg", 0.92));
  let capturing = false;
  async function capture() {
    if (capturing) return; capturing = true;
    try {
      const live = state.source === "live";
      const src = live ? video : state.ref;
      const crop = live ? (state.track && state.track.score > 0.65 ? state.track : null) : state.box;
      vf.animate?.([{ opacity: 0.3 }, { opacity: 1 }], { duration: 240 });
      const { full, framed } = develop(src, crop);
      const [fb, rb] = await Promise.all([toBlob(framed), toBlob(full)]);
      if (state.lastShot) { URL.revokeObjectURL(state.lastShot.framedUrl); URL.revokeObjectURL(state.lastShot.fullUrl); }
      state.lastShot = { framed: fb, full: rb, framedUrl: URL.createObjectURL(fb), fullUrl: URL.createObjectURL(rb), tip: state.claudeTip,
        look: LOOKS[lookKey()].label + (state.look === "auto" && state.auto ? ` · auto for ${state.auto.why}` : "") };
      $("#thumb").style.backgroundImage = `url(${state.lastShot.framedUrl})`; $("#thumb").disabled = false;
      resetToIdle(); openSheet();
    } finally { capturing = false; }
  }

  /* ---------- result sheet ---------- */
  function openSheet() {
    const s = state.lastShot; if (!s) return;
    $("#imgFramed").src = s.framedUrl; $("#imgFull").src = s.fullUrl; $("#sheetLook").textContent = s.look;
    const tipEl = $("#sheetTip"); tipEl.hidden = !s.tip; tipEl.textContent = "";
    if (s.tip) { const b = document.createElement("b"); b.textContent = "Claude's tip: "; tipEl.append(b, s.tip); }
    $("#saveHelp").textContent = "Tap Save, or press and hold a photo and choose Save to Photos.";
    $("#sheet").hidden = false;
  }
  $("#thumb").onclick = openSheet;
  $("#closeSheet").onclick = () => ($("#sheet").hidden = true);
  $("#sheet").onclick = (e) => { if (e.target.id === "sheet") $("#sheet").hidden = true; };
  document.querySelectorAll("[data-save]").forEach((btn) => (btn.onclick = async () => {
    const which = btn.dataset.save, blob = state.lastShot?.[which]; if (!blob) return;
    const file = new File([blob], `thirds-${which}-${Date.now()}.jpg`, { type: "image/jpeg" });
    try { if (navigator.canShare?.({ files: [file] })) { await navigator.share({ files: [file] }); return; } }
    catch (e) { if (e?.name === "AbortError") return; }
    $("#saveHelp").textContent = "Saving isn't allowed from here. Press and hold the photo, then choose Save to Photos.";
  }));

  /* ---------- sources ---------- */
  function setReadout() {
    const [a, b] = ASPECTS[state.aspectIdx];
    const src = { live: "Live", still: "Photo", sample: "Sample" }[state.source];
    const ph = { idle: "", scanning: " · Scanning", aiming: " · Aiming", ready: " · Found" }[state.phase];
    readout.textContent = `${a}:${b} · ${src}${ph} · v5`;
  }
  function setStatus(msg, warn) { statusEl.textContent = msg; statusEl.classList.toggle("warn", !!warn); }
  function resetToIdle() {
    clearInterval(state.scanTimer);
    state.box = null; state.track = null; state.tpls = null; state.alignedSince = 0;
    setPhase("idle"); setZoom(null);
    if (state.source === "live") { video.hidden = false; still.hidden = true; }
    else { video.hidden = true; still.hidden = false; showStill(); }
    hint.innerHTML = "Tap the shutter to <b>scan</b>";
  }
  function useStill(img, kind) {
    stopCamera(); state.source = kind; state.img = img; state.ref = null; tag.hidden = kind !== "sample";
    resetToIdle();
  }
  function stopCamera() {
    if (state.stream) state.stream.getTracks().forEach((t) => t.stop());
    state.stream = null; video.srcObject = null; $("#camLabel").textContent = "Live camera";
  }
  async function startCamera() {
    if (state.source === "live") return;
    setStatus("Starting the camera…");
    if (!navigator.mediaDevices?.getUserMedia) return cameraBlocked();
    try {
      const s = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: "environment" }, width: { ideal: 1920 }, height: { ideal: 1440 } }, audio: false,
      });
      state.stream = s; video.srcObject = s; await video.play();
      state.source = "live"; tag.hidden = true; $("#camLabel").textContent = "Camera on";
      resetToIdle();
      setStatus("Point at a scene and press the shutter. Thirds scans for 5 seconds.");
    } catch (e) { cameraBlocked(); }
  }
  function cameraBlocked() {
    setStatus("Live camera isn't allowed here. Tap Use a photo — iPhone lets you take one with the camera.", true);
  }
  $("#camBtn").onclick = startCamera;
  $("#photoInput").onchange = (e) => {
    const f = e.target.files?.[0]; if (!f) return;
    const img = new Image();
    img.onload = () => { useStill(img, "still"); setStatus("Press the shutter to scan your photo."); };
    img.onerror = () => setStatus("That file couldn't be opened. Try a JPEG or PNG photo.", true);
    img.src = URL.createObjectURL(f); e.target.value = "";
  };

  /* ---------- controls ---------- */
  function refreshLookChips() {
    document.querySelectorAll(".look").forEach((b) => {
      b.setAttribute("aria-pressed", b.dataset.look === state.look);
      if (b.dataset.look === "auto") b.textContent = state.auto ? `Auto · ${LOOKS[state.auto.look].label}` : "Auto";
    });
  }
  function buildLooks() {
    const wrap = $("#looks");
    for (const key of ["auto", ...Object.keys(LOOKS)]) {
      const b = document.createElement("button"); b.className = "look"; b.dataset.look = key;
      b.textContent = key === "auto" ? "Auto" : LOOKS[key].label;
      b.onclick = () => { state.look = key; refreshLookChips(); applyPreviewLook(); };
      wrap.append(b);
    }
    refreshLookChips();
  }
  const toggle = (btn, key) => (btn.onclick = () => { state[key] = !state[key]; btn.setAttribute("aria-pressed", state[key]); });
  toggle($("#gridBtn"), "grid");
  toggle($("#dateBtn"), "stamp");
  $("#aspectBtn").onclick = () => {
    state.aspectIdx = (state.aspectIdx + 1) % ASPECTS.length;
    const [a, b] = ASPECTS[state.aspectIdx]; $("#aspectBtn").textContent = `${a}:${b}`;
    state.ref = null; resetToIdle(); fit();
  };
  shutter.onclick = () => {
    if (state.phase === "idle") startScan();
    else if (state.phase === "aiming" || state.phase === "ready") capture();
  };
  $("#resetBtn").onclick = () => { state.ref = null; resetToIdle(); setStatus("Press the shutter to scan again."); };

  /* ---------- Ask Claude (inside the Claude app only, on the viewer's own Claude usage) ---------- */
  let sample = null, askAvailable = false;
  function updateAsk() { $("#askBtn").hidden = !(askAvailable && state.source === "still" && state.phase === "ready"); }
  (async () => {
    try {
      if (!window.claude?.use) return;
      sample = await window.claude.use("sample"); if (!sample) return;
      const lim = await sample.limits().catch(() => null);
      askAvailable = !!lim?.images; updateAsk();
    } catch (e) { /* not inside Claude: the free on-device scan still works */ }
  })();
  $("#askBtn").onclick = async () => {
    if (!sample || !state.ref) return;
    const btn = $("#askBtn"); btn.disabled = true; btn.classList.add("busy");
    setStatus("Claude is studying your photo…");
    try {
      const c = document.createElement("canvas"); c.width = 1024; c.height = Math.round(1024 / aspect());
      c.getContext("2d").drawImage(state.ref, 0, 0, c.width, c.height);
      const blob = await toBlob(c);
      const res = await sample.json(
        "You are a photography coach. The image is a phone photo. Choose the single best crop inside it for a striking, " +
        "well-composed photo (rule of thirds, clean edges, strong subject, no awkward cut-offs). The crop keeps the same shape as the image, " +
        "so its width and height fractions are equal. Also pick the film look that suits it best from: natural, golden, slate, mono, faded. " +
        'Reply with only JSON like {"x":0.1,"y":0.2,"size":0.7,"look":"golden","tip":"One short sentence on how to reshoot this better."} ' +
        "where x and y are the crop's top-left corner as fractions (0-1) of the image width and height, and size (0.35-1) is the crop's width as a fraction of the image width.",
        { images: blob }
      );
      const s = Math.min(1, Math.max(0.35, Number(res?.size) || 0.75));
      const x = Math.min(1 - s, Math.max(0, Number(res?.x) || 0)), y = Math.min(1 - s, Math.max(0, Number(res?.y) || 0));
      state.box = { x, y, w: s, h: s, score: 1 };
      if (LOOKS[res?.look]) { state.auto = { look: res.look, why: "Claude's pick" }; refreshLookChips(); applyPreviewLook(); }
      state.claudeTip = typeof res?.tip === "string" ? res.tip.slice(0, 220) : "";
      hint.innerHTML = "Claude's <b>shot</b> · tap ✓";
      setStatus(state.claudeTip ? "Claude: " + state.claudeTip : "Claude moved the box. Tap ✓ to develop it.");
    } catch (e) {
      const code = e?.code;
      if (["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed", "images_unavailable"].includes(code)) {
        askAvailable = false; updateAsk(); setStatus("Claude isn't available for this page. The free scan still works.", true);
      } else if (code === "rate_limited") setStatus("Claude is busy for you right now. Try again in a little while.", true);
      else if (code === "cancelled") setStatus("");
      else setStatus("Claude couldn't frame this one. Tap Claude to try again.", true);
    } finally { btn.disabled = false; btn.classList.remove("busy"); }
  };

  /* ---------- main loop ---------- */
  function loop(now) {
    if (state.phase === "aiming" || (state.phase === "scanning" && state.source === "live" && state.tpls)) trackStep(now);
    drawOverlay(now);
    requestAnimationFrame(loop);
  }
  buildLooks();
  new ResizeObserver(fit).observe(stage);
  useStill(makeSample(), "sample");
  fit();
  requestAnimationFrame(loop);
})();
</script>
</body></html>
